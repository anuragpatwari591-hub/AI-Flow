[project]
name = "reelstudio"
version = "0.1.0"
description = "Review-first Gen Z Reel studio: trends, original writing, FFmpeg rendering, official Instagram publishing, analytics."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
  "pydantic>=2.6", "pydantic-settings>=2.2", "pillow>=10", "numpy>=1.26",
  "httpx>=0.27", "pyyaml>=6", "cryptography>=42", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]
[project.scripts]
reelstudio = "reelstudio.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
reelstudio = ["api/static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
