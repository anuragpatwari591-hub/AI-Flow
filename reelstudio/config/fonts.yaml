# Font registry. A font is only usable by the renderer if it has a license entry here.
# To add a condensed/editorial face (e.g. Bebas Neue, Oswald - both SIL OFL): put the file in reelstudio/fonts/,
# add an entry below with its license + source, and keep the license text next to it.
fonts:
  inter_light:    {path: /usr/share/fonts/opentype/inter/Inter-Light.otf,    family: Inter, style: clean_sans, license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-inter/copyright, source: "https://github.com/rsms/inter", copyright: "2016-2023 The Inter Project Authors"}
  inter_regular:  {path: /usr/share/fonts/opentype/inter/Inter-Regular.otf,  family: Inter, style: clean_sans, license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-inter/copyright, source: "https://github.com/rsms/inter", copyright: "2016-2023 The Inter Project Authors"}
  inter_medium:   {path: /usr/share/fonts/opentype/inter/Inter-Medium.otf,   family: Inter, style: clean_sans, license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-inter/copyright, source: "https://github.com/rsms/inter", copyright: "2016-2023 The Inter Project Authors"}
  inter_bold:     {path: /usr/share/fonts/opentype/inter/Inter-Bold.otf,     family: Inter, style: bold_sans,  license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-inter/copyright, source: "https://github.com/rsms/inter", copyright: "2016-2023 The Inter Project Authors"}
  inter_display_extrabold: {path: /usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf, family: Inter Display, style: bold_sans, license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-inter/copyright, source: "https://github.com/rsms/inter", copyright: "2016-2023 The Inter Project Authors"}
  inter_display_light: {path: /usr/share/fonts/opentype/inter/InterDisplay-Light.otf, family: Inter Display, style: editorial_sans, license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-inter/copyright, source: "https://github.com/rsms/inter", copyright: "2016-2023 The Inter Project Authors"}
  liberation_serif:        {path: /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf, family: Liberation Serif, style: editorial_serif, license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-liberation2/copyright, source: "https://github.com/liberationfonts", copyright: "Red Hat / Google / Ascender"}
  liberation_serif_italic: {path: /usr/share/fonts/truetype/liberation/LiberationSerif-Italic.ttf, family: Liberation Serif, style: editorial_serif, license: "SIL OFL 1.1", license_ref: /usr/share/doc/fonts-liberation2/copyright, source: "https://github.com/liberationfonts", copyright: "Red Hat / Google / Ascender"}
  dejavu_sans_bold: {path: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf, family: DejaVu Sans, style: fallback, license: "Bitstream Vera License (free to use/embed)", license_ref: /usr/share/doc/fonts-dejavu-core/copyright, source: "https://dejavu-fonts.github.io", copyright: "Bitstream Inc. / Tavmjong Bah"}
