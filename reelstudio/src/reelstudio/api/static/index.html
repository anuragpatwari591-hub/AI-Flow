*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
#pausebar{margin-left:auto;display:flex;gap:8px;align-items:center}
nav{display:flex;gap:2px;overflow-x:auto;padding:6px 12px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--panel);color:var(--fg);outline:1px solid var(--line)}
main{padding:16px;max-width:1200px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.a,input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button.a{cursor:pointer;background:var(--panel)}button.a:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.danger{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:12px;color:var(--mut);margin:1px}
.ok{color:var(--ok);border-color:var(--ok)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--bad);border-color:var(--bad)}
.mut{color:var(--mut)}.big{font-size:20px;font-weight:600}h2{font-size:16px;margin:4px 0 12px}
video{max-width:180px;border-radius:6px;background:#000}img.cov{width:90px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0;color:var(--mut);font-size:12px}
#login{max-width:420px;margin:12vh auto}
