# One-box production stack: Postgres + API + worker + Caddy (automatic HTTPS via Let's Encrypt HTTP-01).
# Needs: Docker, ports 80/443 reachable, and a DNS A record for RS_DOMAIN -> this server (e.g. <name>.duckdns.org).
# Everything secret lives in ./.env (git-ignored, chmod 600). RS_PUBLIC_BASE_URL and RS_META_REDIRECT_URI are DERIVED
# from RS_DOMAIN below so they can never disagree. Publishing stays OFF and review-required by default (app defaults).
# Caveat: validated with `docker compose config`; a full image build could not be run in the authoring sandbox.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}     # keep a small disk from filling with logs
x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  logging: *logging
  environment:
    RS_DATABASE_URL: "postgresql+psycopg://reel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/reelstudio"
    RS_PUBLIC_BASE_URL: "https://${RS_DOMAIN:?set RS_DOMAIN in .env}"
    RS_META_REDIRECT_URI: "https://${RS_DOMAIN}/api/instagram/callback"
    RS_DATA_DIR: /data
  volumes: [data:/data]
services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment: {POSTGRES_USER: reel, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}", POSTGRES_DB: reelstudio}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U reel -d reelstudio"], interval: 5s, retries: 10}
  api:
    <<: *app
    depends_on: {db: {condition: service_healthy}}
    command: sh -c "reelstudio migrate && reelstudio serve --host 0.0.0.0 --port 8000"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 10s
      retries: 12
  worker:            # exactly one instance
    <<: *app
    depends_on: {api: {condition: service_healthy}}
    command: reelstudio worker
    healthcheck:
      test: ["CMD", "python", "-c", "import time,sys;sys.exit(0 if time.time()-float(open('/data/worker.heartbeat').read())<180 else 1)"]
      interval: 30s
      retries: 3
      start_period: 60s
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment: {RS_DOMAIN: "${RS_DOMAIN}"}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", caddy_data:/data, caddy_config:/config]
    depends_on: [api]
volumes: {pgdata: {}, data: {}, caddy_data: {}, caddy_config: {}}
